name: Merge i-vadaut-ai-studio into canonical repo once

on:
  push:
    paths:
      - '.github/workflows/merge-ai-studio-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical i-vadaut
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout i-vadaut-ai-studio snapshot
        uses: actions/checkout@v4
        with:
          repository: yanivmizrachiy/i-vadaut-ai-studio
          ref: main
          path: _source

      - name: Consolidate source under ai-studio
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git -C _source rev-parse HEAD)"
          rm -rf ai-studio
          mkdir -p ai-studio
          rsync -a --exclude='.git' _source/ ai-studio/
          rm -rf _source
          cat > ai-studio/MIGRATED_FROM.md <<EOF
          # מקור ההעברה

          התיקייה הזו הועברה בשלמותה מהריפו \`yanivmizrachiy/i-vadaut-ai-studio\` כחלק מאיחוד הריפואים.

          מקור: https://github.com/yanivmizrachiy/i-vadaut-ai-studio
          commit מקור: \`${SOURCE_SHA}\`

          מקור האמת הקנוני לאחר האיחוד: \`yanivmizrachiy/i-vadaut\`.
          EOF
          rm -f .github/workflows/merge-ai-studio-once.yml

      - name: Commit merged snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to merge.'
            exit 0
          fi
          git commit -m 'Consolidate i-vadaut-ai-studio into canonical i-vadaut'
          git push origin HEAD:main
